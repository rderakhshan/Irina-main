# OpenShell sandbox policy for Irina Day 2.
# No provider is attached when this policy is used, and the host model key is
# never passed into the sandbox. No network rules are declared, so outbound
# connections are denied by default.
version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /bin
    - /usr
    - /usr/local
    - /lib
    - /lib64
    - /etc/ld.so.cache
    - /etc/ssl
    - /etc/nsswitch.conf
    - /etc/hosts
    - /etc/resolv.conf
    - /proc
    - /dev/urandom
  read_write:
    - /tmp
    - /dev/null

landlock:
  compatibility: hard_requirement

process:
  run_as_user: "1000"
  run_as_group: "1000"

network_policies: {}
